note: 'Derived by binding each documented nCino Mortgage MCP tool to the OpenAPI operationId(s)
  that back it. The live tools/list endpoint is OAuth-gated (401), so tools are mapped
  by published name and description rather than by an observed inputSchema; each tool''s
  real input contract is the parameters + requestBody of the bound operation in openapi/ncino-mortgage-openapi.yml.
  Every operationId below was verified verbatim against that spec. nCino models most
  state transitions (promote, demote, enable, disable, welcome email, invite) as a
  polymorphic POST .../actions operation with the action named in the request body,
  so several distinct tools bind to the same operationId — those rows are marked accordingly.'
