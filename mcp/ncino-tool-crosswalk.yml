mcp_only:
- tool: run_aus
  reason: 'No public REST operation submits a loan application to Desktop Underwriter
    or Loan Product Advisor. The published OpenAPI does define the AUS schemas — AusOrderBody,
    AusOrderResult, AusFinding and AusFindingList in components.schemas — but no path
    object in the document references any of them, so the AUS capability is reachable
    through the LO MCP server and not through the public REST contract. Verified by
    searching every path object in openapi/ncino-mortgage-openapi.yml for those schema
    references.'
- tool: fetch_aus_history
  reason: No public REST operation returns the AUS order log, for the same reason as
    run_aus — AusFindingList is defined but unreferenced by any path. The nearest but
    non-equivalent REST surface is services verifications (verifications-index / verifications-show),
    which covers verification reports rather than AUS findings.
