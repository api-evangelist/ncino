      description: "This endpoint allows a variety of actions to be taken on a <<glossary:borrower
        account>>.\n\n> \U0001F4CC Available actions\n**SEND_WELCOME_EMAIL** - Resend
        welcome email\n**REASSIGN_LO** - Reassign borrower account to a different
        loan officer. Applications for the indicated borrower account may be reassigned
        to the new <<glossary:loan officer>>.\nIf existing applications are not reassigned
        or loan records are associated with the borrower account then a new borrower
        account will be created.\n<<glossary:Partner>> information will be removed
        during the reassignment and will need to be reestablished through a borrower
        account update.\nTo update the association of a loan officer and borrower
        account on a loan record, update the loan officer on the loan record.\n**ASSIGN_PARTNER**
        - Assign partner to borrower account\n**REMOVE_PARTNER** - Unassign partner
        from borrower account\n\nThe `action` property must be one of the available
        actions above, provided in the JSON as screaming snake case."
