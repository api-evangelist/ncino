components:
  parameters:
    Page:
      name: page
      description: The page to retrieve.
      required: false
      in: query
      schema:
        type: integer
    PageSize:
      name: page_size
      description: The number of records returned in each page.
      required: false
      in: query
      schema:
        type: integer
    CreatedAfter:
      name: created_after
      description: The date which a resource must be created after to be returned.
      required: false
      in: query
      schema:
        type: string
        format: date-time
    CreatedBefore:
      name: created_before
      description: The date which a resource must be created before to be returned.
      required: false
      in: query
      schema:
        type: string
        format: date-time
    UpdatedAfter:
      name: updated_after
      description: The date which a resource must be updated after to be returned.
      required: false
      in: query
      schema:
        type: string
        format: date-time
    UpdatedBefore:
      name: updated_before
      description: The date which a resource must be updated before to be returned.
      required: false
      in: query
      schema:
        type: string
        format: date-time
    ApiVersionHeader:
      name: X-Api-Version
      description: Specify API version, for example '1.0'. By default, the version
        configured in the company settings is used.
      required: false
      in: header
      schema:
        type: string
  responses:
    BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorSet"
      headers:
        X-Api-Version:
          "$ref": "#/components/headers/ApiVersionResponseHeader"
        X-Api-Supported-Versions:
          "$ref": "#/components/headers/ApiSupportedVersionsResponseHeader"
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorSet"
      headers:
        X-Api-Version:
          "$ref": "#/components/headers/ApiVersionResponseHeader"
        X-Api-Supported-Versions:
          "$ref": "#/components/headers/ApiSupportedVersionsResponseHeader"
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorSet"
      headers:
        X-Api-Version:
          "$ref": "#/components/headers/ApiVersionResponseHeader"
        X-Api-Supported-Versions:
          "$ref": "#/components/headers/ApiSupportedVersionsResponseHeader"
    NotFoundError:
      description: Not found
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorSet"
      headers:
        X-Api-Version:
          "$ref": "#/components/headers/ApiVersionResponseHeader"
        X-Api-Supported-Versions:
          "$ref": "#/components/headers/ApiSupportedVersionsResponseHeader"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorSet"
      headers:
        X-Api-Version:
          "$ref": "#/components/headers/ApiVersionResponseHeader"
        X-Api-Supported-Versions:
          "$ref": "#/components/headers/ApiSupportedVersionsResponseHeader"
    NotImplementedError:
      description: Not implemented error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorSet"
      headers:
        X-Api-Version:
          "$ref": "#/components/headers/ApiVersionResponseHeader"
        X-Api-Supported-Versions:
          "$ref": "#/components/headers/ApiSupportedVersionsResponseHeader"
    WebhookResponse:
      description: Return a 200 status to indicate that the data was received successfully
      content: {}
  headers:
    ContentDispositionResponseHeader:
      description: Additional information about response payload.
      schema:
        type: string
    ApiVersionResponseHeader:
      description: API version.
      schema:
        type: string
    ApiSupportedVersionsResponseHeader:
      description: API supported versions for endpoint.
      schema:
        type: string
    LocationResponseHeader:
      description: URL to redirect.
      schema:
        type: string
  schemas:
    OAuthAuthorizeBody:
      type: object
      properties:
        response_type:
          type: string
          enum:
          - code
          description: Response type.
        response_mode:
          type: string
          enum:
          - query
          - fragment
          - form_post
          description: 'Response mode (default: query).'
        client_id:
          type: string
          description: Client ID.
        redirect_uri:
          type: string
          description: Absolute redirect URI
        scope:
          type: string
          description: Scope of the access request
      required:
      - response_type
      - client_id
      additionalProperties: false
    OAuthAuthorize:
      type: object
      properties:
        status:
          type: string
          enum:
          - redirect
          - post
          description: Response status.
        redirect_uri:
          type: string
          description: Absolute redirect URI
        body:
          type: object
          properties:
            code:
              type: string
            state:
              type: string
      required:
      - status
      additionalProperties: false
    OAuthTokenBody:
      type: object
      properties:
        grant_type:
          type: string
          enum:
          - client_credentials
          - refresh_token
          - authorization_code
          description: Grant type.
        client_id:
          type: string
          description: Client ID.
        client_secret:
          type: string
          description: Client secret.
      required:
      - grant_type
      - client_id
      - client_secret
      description: Available properties for obtaining an access token
      additionalProperties: false
    OAuthTokenClientBody:
      allOf:
      - "$ref": "#/components/schemas/OAuthTokenBody"
      - type: object
        properties:
          scope:
            type: string
            description: Requested scope(s).
        additionalProperties: false
      description: Available properties for obtaining an access token
    OAuthTokenRefreshBody:
      allOf:
      - "$ref": "#/components/schemas/OAuthTokenBody"
      - type: object
        properties:
          refresh_token:
            type: string
            description: Refresh token.
          scope:
            type: string
            description: Requested scope(s).
        required:
        - refresh_token
        additionalProperties: false
      description: Available properties for refreshing an access token
    OAuthTokenCodeBody:
      allOf:
      - "$ref": "#/components/schemas/OAuthTokenBody"
      - type: object
        properties:
          code:
            type: string
            description: Authorization Code.
          redirect_uri:
            type: string
            description: Redirect URL.
        required:
        - code
        - redirect_uri
        additionalProperties: false
      description: Available properties for obtaining an access token
    OAuthActionBody:
      type: object
      properties:
        action:
          type: string
          enum:
          - REVOKE
          - INTROSPECT
          description: Action to perform.
        client_id:
          type: string
          description: Client ID.
        client_secret:
          type: string
          description: Client secret.
        token:
          type: string
          description: Access or refresh token.
        token_type_hint:
          type: string
          enum:
          - access_token
          - refresh_token
          description: Type of token.
      required:
      - client_id
      - client_secret
      - token
      description: Available properties for access token actions
      additionalProperties: false
    OAuthToken:
      type: object
      properties:
        access_token:
          type: string
          description: Access token issued.
        refresh_token:
          type: string
          description: Refresh token issued.
        token_type:
          type: string
          enum:
          - Bearer
          description: Type of token.
        expires_in:
          type: integer
          description: Duration of time the access token is granted for (seconds).
        scope:
          type: string
          description: Scopes granted.
        created_at:
          type: integer
          description: Timestamp when access token was issued.
      required:
      - access_token
      - token_type
      - expires_in
      - created_at
      description: OAuth 2.0 Access Token.
      example:
        access_token: MTQ0NjJkZmQ5OTM2NDE1ZTZjNGZmZjI3
        refresh_token: 3IjZmZGNjZTZ1EDN2MTO5QmZkJjN0QTM
        token_type: Bearer
        expires_in: 900
        scope: external
    OAuthTokenInfo:
      type: object
      properties:
        expires_in:
          type: integer
          description: Duration of time the access token is granted for (seconds).
        scope:
          type: array
          items:
            type: string
          description: Scopes granted.
        created_at:
          type: integer
          description: Timestamp when access token was issued.
        credential:
          type: object
          properties:
            client_id:
              type: string
          description: Organization credential associated with access token.
      required:
      - expires_in
      - created_at
      - credential
      description: OAuth 2.0 Access Token information.
      example:
        scope:
        - external
        expires_in: 900
        credential:
          client_id: MTQ0NjJkZmQ5OTM2NDE1ZTZjNGZmZjI3
        created_at: 171216788
    OAuthTokenIntrospect:
      type: object
      properties:
        active:
          type: boolean
          description: Indicates whether access token is active.
        scope:
          type: string
          description: Scopes granted.
        client_id:
          type: string
          description: Client ID of the organization credential associated with the
            access token.
        token_type:
          type: string
          description: Type of access token ("Bearer").
        exp:
          type: integer
          description: Access token expiration timestamp.
        iat:
          type: integer
          description: Access token issued at timestamp.
      required:
      - active
      description: OAuth 2.0 Access Token introspect information.
      example: |-
        { "active" : true, "scope": "external", "client_id": "MTQ0NjJkZmQ5OTM2NDE1ZTZjNGZmZjI3", "token_type":"Bearer", "exp":1712271294, "iat":1712270394 }
        { "active" : false }
    OAuthError:
      type: object
      properties:
        error:
          type: string
          enum:
          - invalid_request
          - invalid_client
          - invalid_grant
          - invalid_scope
          - unauthorized_client
          - unsupported_grant_type
          description: Error code.
        error_description:
          type: string
          description: Error description.
      required:
      - error
      description: OAuth 2.0 Error.
      example:
        error: invalid_client
        error_description: Client auth failed due to unknown client, no client auth
          included, or unsupported auth method.
    Error:
      type: object
      properties:
        id:
          type: string
          description: A unique ID (useful as a reference when debugging an error
            with support)
        status:
          type: integer
          description: The HTTP status code
        title:
          type: string
          description: A generic title
        detail:
          type: string
          description: A detailed message
        _links:
          type: object
          description: A list of relevant links
      required:
      - id
      - status
      - title
      example:
        id: 123abc
        status: 400
        title: Generic title for the error
        detail: Detailed message for the error
        _links:
          resource: contextual resource if applicable
    ErrorSet:
      type: object
      properties:
        errors:
          type: array
          items:
            "$ref": "#/components/schemas/Error"
      required:
      - errors
      example:
        errors:
        - id: 123abc
          status: 400
          title: Generic title for the error
          detail: Detailed message for the error
          _links:
            resource: contextual resource if applicable
    AbstractCollection:
      allOf:
      - "$ref": "#/components/schemas/AbstractModel"
      - type: object
        properties:
          contents:
            type: array
            items:
              type: object
            description: The contents for the collection.
        required:
        - contents
        additionalProperties: false
    AbstractModel:
      type: object
      properties:
        _self:
          type: string
          description: The model's resource link to itself.
        _type:
          type: string
          description: The model's type.
        _links:
          type: object
          description: A list of links for the model's associations.
      required:
      - _self
      - _type
      additionalProperties: false
    AbstractPagination:
      allOf:
      - "$ref": "#/components/schemas/AbstractCollection"
      - type: object
        properties:
          total_pages:
            type: integer
            description: The total number of pages in the collection.
          total:
            type: integer
            description: The total number of items in the collection.
        additionalProperties: false
    AbstractResourceModel:
      allOf:
      - "$ref": "#/components/schemas/AbstractModel"
      - type: object
        properties:
          id:
            type: string
            format: uuid
            description: Unique identifier for the record.
        required:
        - id
        additionalProperties: false
    NoContent:
      type: object
      properties: {}
      additionalProperties: false
    ResourceCollectionCreated:
      allOf:
      - "$ref": "#/components/schemas/AbstractCollection"
      - type: object
        properties:
          contents:
            type: array
            items:
              type: object
            description: Array of created resources.
        required:
        - contents
        additionalProperties: false
      description: |-
        Generic base class for returning multiple created resources with their full
        representations. Extend this class and specify the item type via cattr_reader,
        similar to AbstractPagination.
    ResourceCreated:
      allOf:
      - "$ref": "#/components/schemas/AbstractResourceModel"
      description: Resource created model
    Webhook:
      allOf:
      - "$ref": "#/components/schemas/AbstractResourceModel"
      - type: object
        properties:
          name:
            type: string
            description: Webhook's name.
          url:
            type: string
            format: http_uri
            description: URL called when a webhook event has occurred.
          version:
            type: string
            description: API version to be used when webhook request is rendered.
            nullable: true
          created_at:
            type: string
            format: date-time
            description: Webhook's created at timestamp.
            nullable: true
        additionalProperties: false
      description: Webhook record
    WebhookPagination:
      allOf:
      - "$ref": "#/components/schemas/AbstractPagination"
      - type: object
        properties:
          contents:
            type: array
            items:
              "$ref": "#/components/schemas/Webhook"
        required:
        - contents
    WebhookPostBody:
      type: object
