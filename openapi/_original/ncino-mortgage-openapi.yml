              "$ref": "#/components/headers/ApiVersionResponseHeader"
            X-Api-Supported-Versions:
              "$ref": "#/components/headers/ApiSupportedVersionsResponseHeader"
        '400':
          "$ref": "#/components/responses/BadRequestError"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
      description: "This endpoint will delete a <<glossary:team member>>.\n> \U0001F647
        Heads up!\n**This action is irreversible.**"
      summary: Delete a team member
  "/users/team_members/{team_member_id}/actions":
    post:
      tags:
      - Team Members
      operationId: team_members-actions
      parameters:
      - name: team_member_id
        description: Team member ID.
        required: true
        in: path
        schema:
          type: string
          format: uuid
      - "$ref": "#/components/parameters/ApiVersionHeader"
      responses:
        '204':
          description: No content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NoContent"
          headers:
            X-Api-Version:
              "$ref": "#/components/headers/ApiVersionResponseHeader"
            X-Api-Supported-Versions:
              "$ref": "#/components/headers/ApiSupportedVersionsResponseHeader"
        '412':
          description: Resource is in an invalid state
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorSet"
          headers:
            X-Api-Version:
              "$ref": "#/components/headers/ApiVersionResponseHeader"
            X-Api-Supported-Versions:
              "$ref": "#/components/headers/ApiSupportedVersionsResponseHeader"
        '400':
          "$ref": "#/components/responses/BadRequestError"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
      description: "Performs action on a <<glossary:team member>> account.\n\n> \U0001F4CC
        Available actions\n  **ENABLE** - Activate team member\n  **DISABLE** - Deactivate
        team member\n  **SEND_WELCOME_EMAIL** - Send a welcome email to team member\n
        \ **CHANGE_ORG** - Change team member's organization"
      summary: Perform action on a team member account
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              oneOf:
              - "$ref": "#/components/schemas/EnableTeamMember"
              - "$ref": "#/components/schemas/DisableTeamMember"
              - "$ref": "#/components/schemas/SendWelcomeEmailTeamMember"
              - "$ref": "#/components/schemas/ChangeOrgTeamMember"
              discriminator:
                propertyName: action
                mapping:
                  ENABLE: "#/components/schemas/EnableTeamMember"
                  DISABLE: "#/components/schemas/DisableTeamMember"
                  SEND_WELCOME_EMAIL: "#/components/schemas/SendWelcomeEmailTeamMember"
                  CHANGE_ORG: "#/components/schemas/ChangeOrgTeamMember"
