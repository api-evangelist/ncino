      properties:
        action:
          type: string
          enum:
          - SHARE_APP
          - DEACTIVATE
          - ACTIVATE
          - SUBMIT
          - REJECT
          - REASSIGN_LO
          - CONVERT_TO_LOAN
          description: Action to perform
      required:
      - action
      description: Available properties for a loan application action.
      additionalProperties: false
