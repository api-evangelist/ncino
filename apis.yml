  - type: Postman
    url: https://api.ncinomortgage.com/developer_info/postman_collection/1.0
- aid: ncino:mortgage-webhooks
  name: nCino Mortgage Webhooks
  description: 'OpenAPI 3.1 description of the nCino Mortgage webhook surface: webhook
    and subscription management operations plus 35 published event definitions covering
    loans, loan applications, milestones, documents, users, loan officers, organizations,
    state licenses, account assignments, jobs and verifications. Deliveries carry an
    x-api-signature HMAC-SHA256 header computed over the raw JSON body.'
  humanURL: https://developer.ncinomortgage.com/mortgage/docs/webhooks
  baseURL: https://api.ncinomortgage.com
  tags:
  - Webhooks
  - Events
  properties:
  - type: OpenAPI
    url: openapi/ncino-mortgage-webhooks-openapi.json
  - type: Webhooks
    url: asyncapi/ncino-mortgage-webhooks.yml
  - type: Documentation
    url: https://developer.ncinomortgage.com/mortgage/docs/webhooks
- aid: ncino:evault
  name: nCino eVault API
  description: 'OpenAPI 3.1 REST API for the nCino eVault platform: register, retrieve,
    modify, transfer and deliver eNotes, download SMART Doc XML and PDF renditions,
    read enote and transaction audit logs, run connectivity checks, and manage webhooks.
    Bearer JWT auth issued from the eVault token endpoint; stage and production environments
    selected by a path parameter.'
  humanURL: https://developer.ncino.com/e-vault
  baseURL: https://evault.ncino.com/api
  tags:
  - eVault
  - eNote
  - Mortgage
  - Digital Closing
  properties:
  - type: OpenAPI
    url: openapi/ncino-evault-openapi.json
  - type: Documentation
    url: https://developer.ncino.com/e-vault/docs/getting-started
  - type: APIReference
    url: https://developer.ncino.com/e-vault/reference
  - type: Authentication
    url: https://developer.ncino.com/e-vault/docs/authentication
- aid: ncino:mortgage-mcp
  name: nCino Mortgage MCP Servers
  description: 'Two hosted, remote Model Context Protocol servers for the nCino Mortgage
    platform — an LO server for loan officers and an Admin server for organization
    administrators. Both use OAuth 2.1 authorization-code with PKCE (S256) and dynamic
    client registration, advertise RFC 9728 protected-resource metadata, and expose
    tools prefixed ncino_mortgage_ that map onto nCino Mortgage REST operations.'
  humanURL: https://developer.ncinomortgage.com/mortgage/docs/mcp-connectors
  baseURL: https://ncinomortgage.com/mcp
  tags:
  - MCP
