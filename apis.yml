aid: ncino
name: nCino
description: 'nCino is a cloud banking software company whose platform runs commercial,
  small business, consumer and mortgage lending, deposit account opening, and portfolio
  analytics for banks and credit unions. Its public developer surface is split across
  two portals: the nCino Mortgage API (formerly SimpleNexus) at developer.ncinomortgage.com,
  an OAuth 2.0 client-credentials REST API of 251 operations across foundation, loans,
  loan applications, organizations, user management, RBAC, services and webhooks —
  plus 35 OpenAPI 3.1 webhook events and two OAuth-protected remote MCP servers for
  loan officers and administrators — and the nCino eVault API at developer.ncino.com,
  a 24-operation eNote registry, transfer and audit-log API. Platform, AI and Consumer
  Banking API reference sections on the developer portal are behind customer login.'
url: https://raw.githubusercontent.com/api-evangelist/ncino/refs/heads/main/apis.yml
image: https://files.readme.io/38d104d-nCino_Logo-Full_color-Dark_bgWEB.png
x-type: company
x-source: harvest:secondary-market
specificationVersion: '0.20'
created: '2026-08-04'
modified: '2026-08-04'
tags:
- Company
- Banking
- Financial Services
- Lending
- Mortgage
- Loan Origination
- Deposits
- Credit Unions
- Salesforce
- eVault
- eNote
- Webhooks
- MCP
apis:
- aid: ncino:mortgage-mcp
  name: nCino Mortgage MCP Servers
  description: >-
    Two hosted, remote Model Context Protocol servers for the nCino Mortgage platform — an LO server for
    loan officers and an Admin server for organization administrators. Both use OAuth 2.1 authorization-code
    with PKCE (S256) and dynamic client registration, advertise RFC 9728 protected-resource metadata,
    and expose tools prefixed ncino_mortgage_ that map onto nCino Mortgage REST operations.
  humanURL: https://developer.ncinomortgage.com/mortgage/docs/mcp-connectors
  baseURL: https://ncinomortgage.com/mcp
  tags:
  - MCP
  - Agents
  - Mortgage
  properties:
