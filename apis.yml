apis:
- aid: ncino:mortgage
  name: nCino Mortgage API
  description: 'REST API for the nCino Mortgage platform (formerly SimpleNexus) covering
    loans, loan applications, borrowers, loan officers, team members, partners, organizations
    (companies, regions, branches), state licenses, roles and permissions, documents,
    milestones, verifications and webhook subscriptions. OAuth 2.0 client-credentials
    with a five-minute access token; versioned by the X-Api-Version request/response
    header; page/page_size pagination; JSON error envelope with an errors[] array.'
  humanURL: https://developer.ncinomortgage.com/mortgage
  baseURL: https://api.ncinomortgage.com
  tags:
  - Mortgage
  - Lending
  - Loan Origination
  - Banking
  properties:
  - type: OpenAPI
