note: Derived from the 422 component schemas and the path hierarchy of the nCino Mortgage
  OpenAPI. nCino Mortgage models relationships primarily by nesting resources under
  parent paths (/companies/{company_id}/regions, /loans/{loan_id}/borrowers) rather
  than by embedding foreign-key fields, so relationships below are read from the path
  hierarchy as well as from schema $ref links.
identifiers:
  style: opaque string ids per resource, carried in the path
  prefixes: none published
  examples:
  - company_id
  - region_id
  - branch_id
  - loan_id
  - loan_application_id
  - loan_officer_id
  - team_member_id
  - user_borrower_id
  - partner_id
  - state_license_id
  - webhook_id
  - job_id
domains:
- name: organization
  entities:
  - Company
  - Region
  - Branch
  description: A three-level org hierarchy. Companies contain regions; regions contain
    branches. Images, links, reports and state licenses hang off all three levels.
- name: users
  entities:
  - LoanOfficer
  - TeamMember
  - Borrower
  - Partner
  - Alias
  - AccountAssignment
  - Prospect
  description: All user types live under /users. Loan officers and team members are
    assigned to organization nodes through AccountAssignment.
- name: lending
  entities:
  - Loan
  - LoanApplication
  - LoanBorrower
  - Asset
  - Liability
  - Expense
  - BorrowerIncome
  - BorrowerPair
  - LoanMilestone
  - Milestone
  description: Loans and loan applications are separate top-level resources. The nested
    loan-application projection (/loan_applications/nested/{id}) exposes the URLA-shaped
    financial collections.
- name: documents
  entities:
  - LoanDocument
  - LoanDocTask
  - DocPackageOrder
  - DocVendor
  - CustomFormRequest
  - InquiryTask
  description: Document tasks and document package orders attach to both loans and
    loan applications.
- name: compliance
  entities:
  - StateLicense
  - StateLicenseTemplate
  description: State licensing is tracked at company, region, branch and loan-officer
    level, with company-level templates.
- name: access-control
  entities:
  - Role
  - Permission
  - RolePermission
  - RoleUser
  description: RBAC layer; roles carry permission keys and are assigned to users.
- name: eventing
  entities:
  - Webhook
  - WebhookSubscription
  - Job
  description: A webhook is a listener URL; subscriptions bind it to events. Jobs represent
    asynchronous operations.
- name: services
  entities:
  - Verification
  - AusFinding
  description: Verification reports; AUS finding schemas exist in the spec but are
    not referenced by any REST path.
