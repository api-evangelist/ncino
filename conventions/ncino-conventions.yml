async_operations:
  model: job
  pattern: Long-running operations return a job; poll jobs-show (GET /jobs/{job_id})
    or subscribe to the job_status_changed webhook event.
  conflict_guard: 409 "Action cannot be performed due to an ongoing asynchronous job"
    and 423 "Action cannot be performed due to an ongoing loan officer operation"
polymorphic_actions:
  pattern: State transitions are modelled as POST /<resource>/{id}/actions with the
    action named in the request body, rather than as distinct verbs or sub-resources.
  operations:
  - loans-actions
  - loan_applications-actions
  - loan_officers-actions
  - team_members-actions
  - borrowers-actions
  - companies-actions
  - roles-actions
  - webhooks-actions
  - loan_officer_partners-actions
  - loan_borrowers-actions
  - loan_application_borrowers-actions
  - loan_doc_tasks-actions
  - loan_app_doc_tasks-actions
  - loan_milestones-actions
  - verifications-actions
  - authentication-actions
  consequence: The MCP tool surface unrolls these into named tools (promote_loan_officer,
    disable_partner, send_partner_invite …) — see mcp/ncino-tool-crosswalk.yml.
