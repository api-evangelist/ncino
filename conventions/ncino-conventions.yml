authentication:
  style: OAuth 2.0 client credentials, bearer token
  token_endpoint: https://api.ncinomortgage.com/oauth/token
  grant_type: client_credentials
  credentials: API Key (client_id) + API Secret (client_secret)
  token_lifetime_seconds: 900
  documented_lifetime_note: The docs state tokens expire after five minutes while the
    sample response returns expires_in 900; treat 900 as the contract and re-request
    per batch.
  scope: external
  header: 'Authorization: Bearer <access_token>'
  per_credential_authorization: Each API credential is toggled on per resource in API
    Settings; a credential without the resource toggle returns 403.
  evault:
    style: HTTP Basic on the token endpoint, bearer JWT thereafter
    token_endpoint: https://evault.ncino.com/oauth/auth_token
    token_lifetime_seconds: 3600
    refresh_token: true
  see_also: authentication/ncino-authentication.yml
idempotency:
  supported: false
  idempotency_key_header: null
  note: No Idempotency-Key header, request-id replay key, If-Match/ETag conditional
    request, or documented safe-retry contract exists in the nCino Mortgage or eVault
    OpenAPI. Two RBAC beta operations (role_permissions-create, role_permissions-destroy)
    are described as semantically idempotent in prose, but that is set semantics on
    those two operations, not a provider-wide idempotency contract. Retrying a POST
    such as loans-create or loan_officer_partners-create is not safe; nCino signals
    duplicates after the fact with 409 Conflict.
  conflict_signal: HTTP 409 with a duplicate-state message (see errors/ncino-problem-types.yml)
