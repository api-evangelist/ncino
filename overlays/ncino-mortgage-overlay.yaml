- target: $.info
  update:
    x-apievangelist-gaps:
    - No Idempotency-Key, ETag or If-Match contract; write retries are not safe and
      duplicates surface as 409 after the fact.
    - No rate-limit, quota or Retry-After signaling is declared anywhere in the spec
      or the docs.
    - Errors use a JSON:API-style errors[] envelope rather than RFC 9457 application/problem+json,
      and carry no stable per-problem type URI.
    - No operation carries deprecated:true and no Sunset/Deprecation header support
      is declared, so consumers have no machine-readable retirement signal.
    - 'Beta status is carried in prose inside the description rather than in a machine-readable
      extension; 93 of 251 operations are beta, and several beta descriptions ship
      an internal note reading "TODO: Remove the line below when endpoint is ready
      to go live for customers".'
    - The OAuth2 clientCredentials flow declares a relative tokenUrl (/oauth/token)
      and an empty scopes map, so the sole documented scope (external) is not discoverable
      from the spec.
    - AUS schemas (AusOrderBody, AusOrderResult, AusFinding, AusFindingList) are defined
      but referenced by no path, while the LO MCP server exposes run_aus and fetch_aus_history
      — the REST contract does not describe a capability the agent surface offers.
